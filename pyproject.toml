[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optivedge"
version = "0.1.0"
description = "Shared Django app-shell framework: navigation shell, plugin registry, and engagement metadata"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"optivedge" = [
    "templates/**/*.html",
    "templates/**/*.svg",
    "static/**/*",
    # The engagement project template, so `django-admin startproject --template` works from
    # an INSTALLED optivedge and a new environment needs no checkout of this repo. The
    # `-tpl` suffix has to be named explicitly: nothing includes it by default, and a glob
    # of `*.py` would miss every file in here.
    "deployment_template/*-tpl",
    "deployment_template/**/*-tpl",
    # Django's startproject copies whatever the template directory holds, so the marker that
    # gives a generated project its empty `wheels/` directory has to travel with it.
    "deployment_template/wheels/.gitkeep",
]
